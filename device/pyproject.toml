[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musecam-device"
version = "0.3.0"
description = "Portable Raspberry Pi camera application for Muse Cam"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.12,<4", "httpx>=0.27,<1", "Pillow>=9.4,<13"]

[project.optional-dependencies]
sim = ["pygame-ce>=2.5,<3"]
test = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
musecam = "musecam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
musecam = ["static/**/*", "presets.json", "retired-presets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
